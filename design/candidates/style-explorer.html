.cap{display:flex;align-items:center;gap:12px;padding-top:14px}.cap .no{font-family:var(--mono);font-size:13px;color:var(--faint);transition:color .2s}.cap .name{font-size:16px;font-weight:600;line-height:1.4;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cap .strip-mini{margin:0 auto 0 4px;width:40px;flex:none}.cap .no.base{flex:none;white-space:nowrap;font-family:inherit;font-size:12px;font-weight:600;line-height:1.6;padding:0 8px;border-radius:99px;background:var(--well);color:var(--soft)}

.stage.offline .static{display:none}
.slide .static{display:none}.static{position:absolute;left:10px;bottom:10px;z-index:2;font-size:12.5px;line-height:1.4;padding:3px 8px;border-radius:4px;background:#000c;color:#ddd;pointer-events:none}

@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes vt-out{to{opacity:0;transform:scale(.97)}}

/* 并排与单张之间、视口变化用页面过渡：同一方向的画面从卡片放大到单张，其他卡片淡出，侧栏从右侧滑入 */

::view-transition-old(*),::view-transition-new(*){height:100%;object-fit:cover;object-position:50% 0}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both}
::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}
::view-transition-new(info):only-child{animation:info-in var(--glide-d) var(--glide) both}
::view-transition-old(info):only-child{animation:info-out .22s var(--exit) both}
::view-transition-old(bar){display:none}::view-transition-new(bar){animation:none}
/* 视口和缩放只改变形状与位置：外框直接变形，内容不做叠影 */
html[data-vt=reshape]::view-transition-old(*){animation:none;opacity:0}
html[data-vt=reshape]::view-transition-new(*){animation:none}
html[data-vt=reshape]::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both;opacity:1}
html[data-vt=reshape]::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}

"], "kind": "html", "content": "\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'\">\n\u003cmeta charset=\"UTF-8\">\n\u003ctitle>方向 A · 暖纸铅印 · 精修\u003c/title>\n\u003cstyle>\n  :root{\n    --paper:#eee5d5; --paper-deep:#e7dcc8; --card:#faf5ea; --feed:#f3ecdd;\n    --ink:#262019; --ink-soft:#5f564a; --ink-mute:#8a7f6f;\n    --rule:#d8cbb4; --rule-strong:#b9a888;\n    --red:#a34a3e; --red-deep:#7e352b;\n    --brass:#8a6d3b; --gold:#c9a35a;\n    --serif:Georgia,\"Songti SC\",\"SimSun\",serif;\n    --sans:\"Avenir Next\",\"PingFang SC\",\"Microsoft YaHei\",sans-serif;\n    --mono:ui-monospace,\"SF Mono\",Consolas,\"Cascadia Mono\",monospace;\n  }\n  *{margin:0;padding:0;box-sizing:border-box}\n  html,body{width:1440px;height:1000px;overflow:hidden}\n  body{\n    font-family:var(--sans);color:var(--ink);background:var(--paper);\n    background-image:repeating-linear-gradient(0deg,rgba(120,100,70,.028) 0 1px,transparent 1px 3px);\n    font-size:13px;line-height:1.55;\n  }\n  .mono{font-family:var(--mono)}\n  .serif{font-family:var(--serif)}\n\n  /* ── 顶栏：一版活字的版头 ── */\n  .topbar{\n    height:56px;display:flex;align-items:center;gap:16px;padding:0 20px;\n    border-bottom:2px solid var(--ink);background:var(--paper);\n  }\n  .brandmark{\n    width:34px;height:34px;background:var(--ink);color:var(--card);\n    font-family:var(--serif);font-size:15px;font-weight:700;\n    display:grid;place-items:center;box-shadow:3px 3px 0 rgba(38,32,25,.18);\n  }\n  .brand h1{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.04em}\n  .brand small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--ink-mute)}\n  .topbar .order-ref{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-soft)}\n  .topbar .order-ref b{color:var(--ink)}\n  .agent-status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft)}\n  .agent-status i{width:7px;height:7px;border-radius:50%;background:#4a7c59;display:inline-block}\n  .topbtn{\n    height:30px;padding:0 14px;border:1px solid var(--ink);background:transparent;\n    font-family:var(--sans);font-size:12px;color:var(--ink);border-radius:3px;\n  }\n  .topbtn.primary{background:var(--red);border-color:var(--red-deep);color:#fdf9f0;box-shadow:2px 2px 0 rgba(126,53,43,.35)}\n\n  /* ── 三栏 ── */\n  .workspace{display:grid;grid-template-columns:264px 1fr 372px;height:944px}\n\n  /* 侧栏 */\n  .sidebar{background:var(--paper-deep);border-right:1px solid var(--rule-strong);padding:14px 16px;display:flex;flex-direction:column;gap:14px}\n  .side-label{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--ink-mute)}\n  .current-order h2{font-family:var(--serif);font-size:18px;font-weight:700;margin-top:4px}\n  .current-order .ref{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-top:2px}\n  .meter{margin-top:10px}\n  .meter .row{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft)}\n  .meter .track{height:4px;background:var(--rule);margin-top:5px}\n  .meter .fill{height:4px;width:92%;background:var(--brass)}\n  .journey{border-top:1px solid var(--rule-strong);padding-top:14px}\n  .journey ol{list-style:none;display:flex;flex-direction:column;gap:2px}\n  .journey li{display:flex;gap:10px;align-items:baseline;padding:6px 8px;border-left:2px solid transparent}\n  .journey li .no{font-family:var(--mono);font-size:11px;color:var(--ink-mute)}\n  .journey li .t{font-size:13px;color:var(--ink-soft)}\n  .journey li .d{display:block;font-size:11px;color:var(--ink-mute)}\n  .journey li.active{border-left-color:var(--brass);background:rgba(138,109,59,.08)}\n  .journey li.active .t{color:var(--ink);font-weight:600}\n  .journey li.done .no{color:var(--brass)}\n  .history{border-top:1px solid var(--rule-strong);padding-top:14px}\n  .history ul{list-style:none;margin-top:8px;display:flex;flex-direction:column}\n  .history li{padding:7px 8px;border-left:2px solid transparent;display:flex;justify-content:space-between;align-items:center;gap:8px}\n  .history li.active{border-left-color:var(--ink);background:var(--card)}\n  .history .name{font-size:13px;font-weight:600}\n  .history .meta{display:block;font-size:11px;color:var(--ink-mute);font-weight:400}\n  .history .tag{font-family:var(--mono);font-size:10px;color:var(--ink-mute)}\n  .presets{border-top:1px solid var(--rule-strong);padding-top:10px;margin-top:auto}\n  .preset{margin-top:6px;border:1px dashed var(--rule-strong);padding:7px 10px;font-size:12px;color:var(--ink-soft);border-radius:3px}\n\n  /* 中栏：对话 */\n  .chat{display:flex;flex-direction:column;border-right:1px solid var(--rule-strong);background:var(--feed)}\n  .chat-head{padding:14px 24px 12px;border-bottom:1px solid var(--rule);background:var(--paper)}\n  .chat-head .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--ink-mute)}\n  .chat-head h2{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.02em}\n  .chat-head .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}\n  .feed{flex:1;padding:20px 24px;display:flex;flex-direction:column;gap:14px}\n  .msg{display:flex;gap:10px;max-width:82%}\n  .msg .who{flex:0 0 26px;height:26px;display:grid;place-items:center;font-family:var(--mono);font-size:10px;border:1px solid var(--rule-strong);color:var(--ink-soft);background:var(--card);border-radius:3px}\n  .msg .bubble{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:10px 14px;box-shadow:2px 2px 0 rgba(38,32,25,.06)}\n  .msg .bubble p+p{margin-top:6px}\n  .msg .time{font-family:var(--mono);font-size:10px;color:var(--ink-mute);margin-top:4px}\n  .msg.me{align-self:flex-end;flex-direction:row-reverse}\n  .msg.me .bubble{background:var(--ink);color:#f2ead9;border-color:var(--ink);box-shadow:3px 3px 0 rgba(38,32,25,.22)}\n  .msg.me .who{background:var(--ink);color:var(--gold);border-color:var(--ink)}\n  .msg .v{font-family:var(--mono)}\n  .quick{display:flex;gap:8px;padding-left:36px}\n  .quick span{border:1px solid var(--rule-strong);background:var(--card);border-radius:999px;padding:5px 14px;font-size:12px;color:var(--ink-soft)}\n  .quick span.on{border-color:var(--brass);color:var(--brass);font-weight:600;background:rgba(138,109,59,.08)}\n  .composer{border-top:2px solid var(--ink);background:var(--paper);padding:14px 24px 16px}\n  .composer .box{border:1px solid var(--rule-strong);background:var(--card);border-radius:4px;box-shadow:2px 2px 0 rgba(38,32,25,.08)}\n  .composer textarea{width:100%;height:56px;border:0;background:transparent;resize:none;padding:10px 12px;font-family:var(--sans);font-size:13px;color:var(--ink);outline:none}\n  .composer textarea::placeholder{color:var(--ink-mute)}\n  .composer .bar{display:flex;align-items:center;gap:12px;padding:8px 12px;border-top:1px dashed var(--rule)}\n  .composer .hint{font-size:11px;color:var(--ink-mute)}\n  .composer .hint b{color:var(--red);font-weight:600}\n  .send{margin-left:auto;height:32px;padding:0 18px;background:var(--red);color:#fdf9f0;border:1px solid var(--red-deep);font-size:13px;font-weight:600;border-radius:3px;box-shadow:2px 2px 0 rgba(126,53,43,.4)}\n\n  /* 右栏：正在成形的工单（铅印主体） */\n  .draft{padding:20px 18px;background:var(--paper-deep)}\n  .sheet{\n    background:var(--card);border:1px solid var(--rule-strong);\n    box-shadow:7px 7px 0 rgba(38,32,25,.14);\n    border-radius:2px;height:100%;display:flex;flex-direction:column;overflow:hidden;\n  }\n  .sheet-head{padding:13px 18px 10px;border-bottom:2px solid var(--ink)}\n  .sheet-head .kicker{font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:var(--ink-mute)}\n  .sheet-head .row{display:flex;align-items:baseline;justify-content:space-between;margin-top:2px}\n  .sheet-head h2{font-family:var(--serif);font-size:21px;font-weight:700}\n  .state-chip{font-family:var(--mono);font-size:10px;padding:3px 8px;border:1px solid var(--red);color:var(--red-deep);border-radius:2px;background:rgba(163,74,62,.06)}\n  .doc-links{display:flex;gap:8px;margin-top:8px}\n  .doc-links a{flex:1;text-align:center;font-size:12px;padding:6px 0;border:1px solid var(--rule-strong);color:var(--ink-soft);border-radius:3px;background:var(--paper)}\n  .drop{margin:10px 18px 0;border:1.5px dashed var(--rule-strong);border-radius:3px;padding:9px;text-align:center;color:var(--ink-mute);font-size:12px;background:var(--paper)}\n  .drop b{display:block;color:var(--ink-soft);font-weight:600;margin-bottom:2px}\n  .fields{flex:1;overflow:hidden;padding:4px 18px}\n  .group{margin-top:10px}\n  .group>h3{font-family:var(--serif);font-size:13px;letter-spacing:.08em;color:var(--ink);display:flex;align-items:center;gap:8px}\n  .group>h3 .no{font-family:var(--mono);font-size:10px;color:var(--brass)}\n  .group>h3::after{content:\"\";flex:1;height:1px;background:var(--rule)}\n  .frow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px;border-bottom:1px solid var(--rule)}\n  .frow .k{font-size:12px;color:var(--ink-soft);flex:0 0 74px}\n  .frow .v{font-family:var(--mono);font-size:12.5px;color:var(--ink);text-align:right}\n  .frow .v.unset{color:var(--ink-mute);font-family:var(--sans)}\n  .frow .v.pending{color:var(--red-deep)}\n  .frow.pending-row{background:rgba(163,74,62,.05);border-bottom-color:rgba(163,74,62,.35)}\n  .estimate{margin:10px 18px 0;border-top:2px solid var(--ink);padding-top:10px;display:flex;align-items:baseline;justify-content:space-between}\n  .estimate .plan{font-size:11px;color:var(--ink-mute)}\n  .estimate .plan b{display:block;font-size:12px;color:var(--ink-soft);font-weight:600}\n  .estimate .num{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:-.01em}\n  .estimate .num small{font-size:13px;color:var(--ink-soft)}\n  .actions{display:flex;gap:10px;padding:12px 18px 14px}\n  .actions .main{flex:1.4;height:38px;background:var(--red);border:1px solid var(--red-deep);color:#fdf9f0;font-size:14px;font-weight:700;letter-spacing:.06em;border-radius:3px;box-shadow:3px 3px 0 rgba(126,53,43,.4);font-family:var(--serif)}\n  .actions .ghost{flex:1;height:38px;background:transparent;border:1px solid var(--ink);color:var(--ink);font-size:13px;border-radius:3px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cheader class=\"topbar\">\n    \u003cdiv class=\"brandmark serif\">PO\u003c/div>\n    \u003cdiv class=\"brand\">\u003ch1>印刷订单智能体\u003c/h1>\u003csmall>PRINT OPERATIONS AGENT\u003c/small>\u003c/div>\n    \u003cdiv class=\"order-ref\">订单 \u003cb>b7fbc3d64e12\u003c/b> · 版本 13\u003c/div>\n    \u003cdiv class=\"agent-status\">\u003ci>\u003c/i>智能体在线\u003c/div>\n    \u003cbutton class=\"topbtn\">接口设置\u003c/button>\n    \u003cbutton class=\"topbtn primary\">新建订单\u003c/button>\n  \u003c/header>\n\n  \u003cdiv class=\"workspace\">\n    \u003caside class=\"sidebar\">\n      \u003cdiv class=\"current-order\">\n        \u003cdiv class=\"side-label\">当前订单\u003c/div>\n        \u003ch2>名片 · 1,200 张\u003c/h2>\n        \u003cdiv class=\"ref\">b7fbc3d64e12\u003c/div>\n        \u003cdiv class=\"meter\">\n          \u003cdiv class=\"row\">\u003cspan>信息度\u003c/span>\u003cspan class=\"mono\">92%\u003c/span>\u003c/div>\n          \u003cdiv class=\"track\">\u003cdiv class=\"fill\">\u003c/div>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cnav class=\"journey\">\n        \u003col>\n          \u003cli class=\"done\">\u003cspan class=\"no\">01\u003c/span>\u003cspan>\u003cspan class=\"t\">收集需求\u003c/span>\u003cspan class=\"d\">告诉智能体印什么\u003c/span>\u003c/span>\u003c/li>\n          \u003cli class=\"active\">\u003cspan class=\"no\">02\u003c/span>\u003cspan>\u003cspan class=\"t\">选择方案\u003c/span>\u003cspan class=\"d\">比较方案与成本\u003c/span>\u003c/span>\u003c/li>\n          \u003cli>\u003c div>\n        \u003cdiv class=\"entry\">\u003ci class=\"doc\">\u003c/i>\u003cspan>查看交接资料\u003c/span>\u003ci class=\"chev\">\u003c/i>\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"drop\">\n        \u003cspan class=\"drop-t\">拖拽 \u003cspan class=\"mono\">PDF\u003c/span> 到这里 · 或点击选择文件 ·\u003c/span>\n        \u003cspan class=\"file-chip\">\u003ci class=\"doc\">\u003c/i>背面文件\u003c/span>\n      \u003c/div>\n\n      \u003cdiv class=\"group\">\n        \u003cspan class=\"g-label mono\">01 · 订单概览\u003c/span>\n        \u003cdiv class=\"f-row ok\">\u003cspan class=\"f-k\">印刷品\u003c/span>\u003cspan class=\"f-v mono\">名片\u003c/span>\u003c/div>\n        \u003cdiv class=\"f-row ok\">\u003cspan class=\"f-k\">数量\u003c/span>\u003cspan class=\"f-v mono\">1,200 张\u003c/span>\u003c/div>\n        \u003cdiv class=\"f-row na\">\u003cspan class=\"f-k\">使用场景\u003c/span>\u003cspan class=\"f-v\">未设置\u003c/span>\u003c/div>\n        \u003cdiv class=\"f-row todo\">\u003cspan class=\"f-k\">预算偏好\u003c/span>\u003cspan class=\"f-v\">待补充\u003c/span>\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"group\">\n        \u003cspan class=\"g-label mono\">02 · 产品规格\u003c/span>\n        \u003cdiv class=\"f-row ok\">\u003cspan class=\"f-k\">成品尺寸\u003c/span>\u003cspan class=\"f-v mono\">90×54 mm\u003c/span>\u003c/div>\n        \u003cdiv class=\"f-row ok\">\u003cspan class=\"f-k\">纸张/材料\u003c/span>\u003cspan class=\"f-v mono\">250 g/m² 铜版纸\u003c/span>\u003c/div>\n        \u003cdiv class=\"f-row ok\">\u003cspan class=\"f-k\">印刷颜色\u003c/span>\u003cspan class=\"f-v mono\">双面四色\u003c/span>\u003c/div>\n        \u003cdiv class=\"f-row ok\">\u003cspan class=\"f-k\">表面工艺\u003c/span>\u003cspan class=\"f-v mono\">无特殊工艺\u003c/span>\u003c/div>\n        \u003cdiv class=\"f-row ok\">\u003cspan class=\"f-k\">装订/后道\u003c/span>\u003cspan class=\"f-v mono\">无需装订\u003c/span>\u003c/div>\n        \u003cdiv class=\"f-row ok\">\u003cspan class=\"f-k\">交期\u003c/span>\u003cspan class=\"f-v mono\">一周内\u003c/span>\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"est\">\n        \u003cdiv class=\"est-meta\">经济方案估算 · 双面四色 · \u003cspan class=\"mono\">250 g/m²\u003c/span> 铜版纸\u003c/div>\n        \u003cdiv class=\"est-price\">\u003cspan class=\"est-arrow mono\">→\u003c/span>\u003cspan class=\"est-num mono\">¥168–214\u003c/span>\u003c/div>\n        \u003cdiv class=\"est-tol mono\">±23 · 经济方案\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"actions\">\n        \u003cspan class=\"btn-pri\">确认交接\u003c/span>\n        \u003cspan class=\"btn-sec\">比较方案\u003c/span>\n      \u003c/div>\n    \u003c/div>\n  \u003c/aside>\n\n\u003c/div>\n\n\u003c/body>\n\u003c/html>\n", "sourceLabel": "direction-b.html", "baseline": false, "interactive": false, "nativeViewport": {"width": 1440, "height": 1000}}, {"id": "candidate-4", "name": "方向 C · 校样批注台", "concept": "编辑桌上摊开的校样页——订单就是正在被批注的文档，对话是页边铅笔批注；确认像签字付印。", "typography": "重磅黑体文档题 + 楷体页边批注 + mono 数字", "palette": ["#f1f1ee", "#ffffff", "#141414", "#6b6b6b", "#f5d90a"], "traits": ["结构性突破：文档为主角，无侧栏无卡片", "聊天退为楷体页边批注（¶ 校对注）", "荧光黄标记 + ^ 插入符 = 待决项", "字段值虚线 = 可就地编辑", "黑签字按钮收尾"], "kind": "html", "content": "\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'\">\n\u003cmeta charset=\"UTF-8\">\n\u003ctitle>方向 C · 校样批注台\u003c/title>\n\u003cstyle>\n:root{\n  --desk:#f1f1ee;\n  --paper:#ffffff;\n  --ink:#141414;\n  --sub:#6b6b6b;\n  --hair:#d9d9d4;\n  --hi:#f5d90a;\n  --red:#b3261e;\n  --faint:#9a9a93;\n  --dash:#bfbfb8;\n  --tagline:#b5b5ae;\n  --hei:\"PingFang SC\",\"Microsoft YaHei\",sans-serif;\n  --kai:\"Kaiti SC\",\"STKaiti\",\"KaiTi\",serif;\n  --mono:Consolas,\"SF Mono\",monospace;\n}\n*{margin:0;padding:0;box-sizing:border-box}\nhtml,body{width:1440px;height:1000px;overflow:hidden}\nbody{font-family:var(--hei);color:var(--ink);background:var(--desk);-webkit-font-smoothing:antialiased}\n.num{font-family:var(--mono);font-size:.92em}\n\n/* ---------- 顶部细条 ---------- */\n.topbar{height:44px;background:var(--paper);border-bottom:1px solid var(--hair);display:flex;align-items:center;padding:0 22px 0 20px}\n.tb-left{display:flex;align-items:center;gap:10px}\n.po{width:22px;height:22px;background:var(--ink);color:#fff;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1px;display:grid;place-items:center;padding-left:1px}\n.tb-title{font-size:14px;font-weight:800;letter-spacing:1px}\n.tb-right{margin-left:auto;display:flex;align-items:center;gap:22px}\n.tb-order{font-family:var(--mono);font-size:12px}\n.tb-nav{font-size:12px;color:var(--sub);letter-spacing:.5px}\n.tb-status{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--sub)}\n.tb-status .dot{font-size:9px;line-height:1;color:var(--ink)}\n.tb-journey{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.5px;border-left:1px solid var(--hair);padding-left:18px}\n\n/* ---------- 主区 ---------- */\n.main{position:relative;display:flex;height:956px}\n.desk{flex:1;background:var(--desk)}\n.sheet{width:680px;height:100%;margin-left:170px;background:var(--paper);box-shadow:0 2px 12px rgba(0,0,0,.06);padding:40px 52px 32px 56px;display:flex;flex-direction:column}\n\n.doc-title{font-size:30px;line-height:40px;font-weight:900;letter-spacing:2px;margin-bottom:12px}\n.doc-meta{display:flex;align-items:center;gap:14px;height:26px;margin-bottom:26px}\n.meta-id{font-family:var(--mono);font-size:12px}\n.stamp{display:inline-block;font-size:11px;font-weight:700;letter-spacing:2px;line-height:1;color:var(--red);border:1.5px solid var(--red);background:var(--paper);padding:4px 7px 4px 9px;transform:rotate(-2deg)}\n\n.sec-head{display:flex;align-items:center;gap:10px;height:20px;margin-bottom:14px}\n.sec-head .no{font-family:var(--mono);font-size:11px;color:var(--sub)}\n.sec-head .st{font-size:15p   else{m.title=c.name;m.setAttribute('sandbox',c.kind==='url'?'allow-scripts allow-same-origin allow-forms':c.interactive?'allow-scripts allow-forms':'');m.referrerPolicy='no-referrer';if(!interactive)m.tabIndex=-1;}
  m.addEventListener('load',()=>{if(c.kind==='url'&&services.get(c.content).ready!==true)return;s.classList.add('ready');fit(s);});
  if(c.kind==='image')m.src=c.content;else if(c.kind!=='url')m.srcdoc=c.content;
  s.append(m);
  if(c.kind==='url'){s.append(serviceNotice());syncService(s,c);}
  if(c.kind!=='html'||c.interactive)s.append(el('span','static',c.kind==='url'?t('live'):c.kind==='image'?t('image'):t('interactive')));
  return s;
 }
 function fit(s){
  if(!s.isConnected)return;
  const native=byId[s.dataset.id].nativeViewport,size=native?{w:native.width,h:native.height}:SIZES[st.viewport],m=s.querySelector('iframe,img'),box=s.parentElement;let r;
  if(box.classList.contains('slide')){const cs=getComputedStyle(box),w=box.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),h=narrow()?(native?innerHeight-$('#bar').offsetHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom):Infinity):box.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);r=box.dataset.zoom==='actual'?1:Math.min(w/size.w,h/size.h,1);}
  else r=Math.min(box.clientWidth/size.w,1);
  if(!(r>0))return;
  s.style.width=`${size.w*r}px`;s.style.height=`${size.h*r}px`;m.style.width=`${size.w}px`;m.style.height=`${size.h}px`;m.style.transform=`scale(${r})`;
 }
 const fitAll=()=>$$('.stage').forEach(fit),refit=()=>requestAnimationFrame(fitAll);

 function specList(c){
  const dl=el('dl','spec');const row=(k,v)=>{dl.append(el('dt',null,k),el('dd',null,v));};
  if(c.typography)row(t('fonts'),c.typography);if(c.traits?.length)row(t('traits'),c.traits.join(' · '));return dl.children.length?dl:null;
 }
 function pickButton(c){const b=el('button','pick');b.type='button';b.dataset.pick=c.id;b.addEventListener('click',()=>choose(c.id));return b;}
 function card(c,i){
  const a=el('article','card');a.dataset.id=c.id;a.style.setProperty('--i',i);a.setAttribute('aria-label',c.name);
  const frame=el('div','frame');frame.style.viewTransitionName=vtName(c);const s=stage(c,false);
  const hit=el('button','hit');hit.type='button';hit.setAttribute('aria-label',t('viewDirection',{name:c.name}));hit.addEventListener('click',()=>setLayout('loupe',c.id));
  s.append(hit);frame.append(s,el('span','pick-mark',t('selected')),el('span','peek',t('peek')));
  const cap=el('div','cap');cap.style.viewTransitionName=`cap-${C.indexOf(c)}`;cap.append(el('span',c.baseline?'no base':'no',no(c)),el('h2','name',c.name));const mini=stripMini(c);if(mini)cap.append(mini);cap.append(pickButton(c));
  a.append(frame,cap);if(c.concept){const lede=el('p','lede',c.concept);lede.title=c.concept;lede.style.viewTransitionName=`lede-${C.indexOf(c)}`;a.append(lede);}return a;
 }
 function syncCompare(){
  const list=shown(),g=$('#grid'),key=list.map(c=>c.id).join();
  if(key!==gridKey){gridKey=key;g.replaceChildren(...list.map(card));}
  g.style.setProperty('--cols',Math.min(Math.max(list.length,1),st.viewport==='mobile'?4:3));
  $$('.card .frame').forEach(f=>f.dataset.viewport=byId[f.parentElement.dataset.id].nativeViewport?'native':st.viewport);
 }

 // 单张查看：所有方向预先排成一条横向轨道，切换时整条轨道滑动，不重新加载画面
 function syncLoupe(dir){
  const list=shown(),key=list.map(c=>c.id).join();if(!list.length)return;
  if(key!==loupeKey){
   loupeKey=key;dir=0;
   $('#track').replaceChildren(...list.map(c=>{const sl=el('div','slide');sl.dataset.id=c.id;sl.append(stage(c,true));return sl;}));
   $('#film').replaceChildren(el('span','film-ind'),...list.map(c=>{const b=el('button');b.type='button';b.dataset.id=c.id;b.append(el('span','fn',no(c)),el('span','ft',c.name),stripMini(c));b.addEventListener('click',()=>go(c.id));return b;}));
  }
  if(!list.some(c=>c.id===st.current))st.current=list[0].id;
  const i=list.findIndex(c=>c.id===st.current),track=$('#track');
  if(!dir)track.style.transition='none';
  track.style.transform=`translateX(${-i*100}%)`;
  if(!dir){track.offsetWidth;track.style.transition='';}
  $$('.slide').forEach(sl=>{const on=sl.dataset.id===st.current;sl.classList.toggle('is-current',on);sl.inert=!on;sl.dataset.zoom=on&&zoomActual?'actual':'fit';sl.firstElementChild.style.viewTransitionName=on?vtName(byId[sl.dataset.id]):'none';});
  $('#prev').disabled=i<=0;$('#next').disabled=i>=list.length-1;
  $$('#film button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===st.current)));
  renderInfo(dir);placeFilm(!dir);
  const cur=$('#film [aria-current=true]'),f=$('#film');
  if(cur&&f.scrollWidth>f.clientWidth)f.scrollTo({left:cur.offsetLeft-16,behavior:calm.matches||!dir?'auto':'smooth'});
 }
 function renderInfo(dir){
  const c=byId[st.current],body=$('#info-body');
  const sw=el('div','big-sw');(c.palette||[]).forEach(h=>{const d=el('div');const x=el('i');x.style.background=h;d.append(x,h.toUpperCase());sw.append(d);});
  const tools=el('div','tools');const z=el('button','tool',zoomActual?t('fit'):t('actual'));z.id='zoom';z.type='button';z.setAttribute('aria-pressed',String(zoomActual));z.addEventListener('click',toggleZoom);tools.append(z);
  const hint=el('p','hint');hint.innerHTML=t('keyboardHint');
  const blocks=[el('span','idx',no(c)),el('h2','name',c.name)];
  if(c.concept)blocks.push(el('p','north',c.concept));if(sw.children.length)blocks.push(sw);const spec=specList(c);if(spec)blocks.push(spec);
  blocks.push(pickButton(c),tools,hint);
  body.replaceChildren(...blocks);paintChoice();
  if(dir)animate(body,[{opacity:0,transform:`translateX(${dir*18}px)`},{opacity:1,transform:'none'}],{duration:420,easing:ease('glide')});
 }
 function toggleZoom(){
  morph(()=>{zoomActual=!zoomActual;const sl=$('.slide.is-current');sl.dataset.zoom=zoomActual?'actual':'fit';fitAll();sl.scrollTo(0,0);const z=$('#zoom');z.textContent=zoomActual?t('fit'):t('actual');z.setAttribute('aria-pressed',String(zoomActual));},'reshape');
 }

 function render(){
  const list=shown(),loupe=st.layout==='loupe'&&list.length>0;
  $('#compare-view').hidden=st.layout!=='compare'||!list.length;$('#loupe').hidden=!loupe;
  syncCompare();syncLoupe(0);
  $$('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===st.layout)));
  $$('[data-viewport]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.viewport===st.viewport)));
  placeThumbs(false);placeFilm(true);
  paintChoice();fitAll();
 }
 function setLayout(layout,id){
  if(layout===st.layout&&!(id&&id!==st.current))return;
  if(layout==='loupe'&&st.layout==='compare')compareScroll=scrollY;
  if(id)st.current=id;st.layout=layout;zoomActual=false;save();
  morph(()=>{
   render();
   if(layout==='loupe'){window.scrollTo(0,0);return;}
   window.scrollTo(0,compareScroll);
   const a=$(`.card[data-id="${CSS.escape(st.current)}"]`),r=a?.getBoundingClientRect();
   if(r&&(r.top<60||r.bottom>innerHeight))a.scrollIntoView({block:'center'});
  });
 }
 function go(id){
  const list=shown(),from=list.findIndex(c=>c.id===st.current),to=list.findIndex(c=>c.id===id);
  if(to<0||to===from)return;
  st.current=id;zoomActual=false;save();syncLoupe(Math.sign(to-from));fitAll();
 }
 function step(d){const list=shown(),i=list.findIndex(c=>c.id===st.current),n=list[i+d];if(n)go(n.id);else nudge(d);}
 function nudge(d){animate($('.slide.is-current .stage'),[{transform:'none'},{transform:`translateX(${d*14}px)`},{transform:'none'}],{duration:320,easing:'ease-out'});}

 // 选择即复制：再次点击“已选择”重新复制这个方向
 function choose(id){
  const fresh=st.chosen!==id;st.chosen=id;save();paintChoice();
  if(fresh){
   animate($(`.card[data-id="${CSS.escape(id)}"] .pick-mark`),[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)'}],{duration:500,easing:ease('pop')});
  }
  copy();
 }
 function paintChoice(){
  $$('.card').forEach(a=>a.classList.toggle('is-chosen',a.dataset.id===st.chosen));
  $$('[data-pick]').forEach(b=>{const on=b.dataset.pick===st.chosen,short=!!b.closest('.cap');b.replaceChildren(document.createTextNode(on?(short?t('selected'):t('selectedCopy')):(short?t('select'):t('selectDirection'))));if(!short)b.append(el('kbd',null,'P'));b.toggleAttribute('data-on',on);b.title=on?t('recopyTitle'):t('selectTitle');});
  $$('#film button').forEach(b=>b.querySelector('.ft').classList.toggle('chosen',b.dataset.id===st.chosen));
 }
 function copyText(){const c=byId[st.chosen];let text=t('copyChoice',{round:DATA.round?t('copyRound',{round:DATA.round}):'',number:no(c),name:c.name});return text;}
 async function copy(t=copyText()){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true;}catch{const a=el('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();try{ok=document.execCommand('copy');}catch{}a.remove();}
  toast(ok,t);
 }
 function toast(ok,text){
  const n=$('#toast');n.toggleAttribute('data-fail',!ok);n.querySelector('b').textContent=ok?t('copied'):t('copyFailed');n.querySelector('code').textContent=ok?text.replace(/\n/g,' · '):text;
  n.classList.remove('show');n.offsetWidth;n.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),ok?2400:8000);
 }

 $$('button[data-layout]').forEach(b=>b.addEventListener('click',()=>setLayout(b.dataset.layout)));
 $$('button[data-viewport]').forEach(b=>b.addEventListener('click',()=>{if(st.viewport===b.dataset.viewport)return;st.viewport=b.dataset.viewport;save();morph(render,'reshape');}));
 // 每个候选都声明了固定画布时，桌面和手机的切换不起作用，收起来。
 if(C.every(c=>c.nativeViewport))$('[data-i18n-aria-label="viewportLabel"]').style.display='none';
 $('#prev').addEventListener('click',()=>step(-1));$('#next').addEventListener('click',()=>step(1));
 document.addEventListener('keydown',e=>{
  if(e.target.closest?.('textarea,input,summary')||e.metaKey||e.ctrlKey||e.altKey||st.layout!=='loupe')return;
  if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);else if(e.key==='Escape')setLayout('compare');else if(e.key.toLowerCase()==='p')choose(st.current);
 });
 function syncBars(){root.style.setProperty('--bar-h',`${$('#bar').offsetHeight}px`);placeThumbs(true);placeFilm(true);refit();}
 window.addEventListener('resize',syncBars,{passive:true});
 document.fonts?.ready.then(()=>{placeThumbs(true);placeFilm(true);});
 $('#bar').hidden=false;
 if(st.layout==='compare'){$('#grid').classList.add('first');$('.intro').classList.add('first');setTimeout(()=>{$('#grid').classList.remove('first');$('.intro').classList.remove('first');},1400);}
 render();syncBars();
 if(services.size){checkServices();setInterval(()=>{if(!document.hidden)checkServices();},5000);window.addEventListener('focus',checkServices);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkServices();});}
})();
</script></body></html>
